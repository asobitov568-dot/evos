    <!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVOS - Header va Hero</title>
  <style>
    /* Umumiy sozlamalar */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f7f9f8;
      color: #1a1a1a;
    }

    /* ================= HEADER ================= */
    header {
      background-color: #ffffff;
      border-bottom: 1px solid #eef0ee;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    /* Yuqori kichik qator */
    .top-bar {
      max-width: 1360px;
      margin: 0 auto;
      padding: 8px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #333;
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .top-links a {
      text-decoration: none;
      color: #2b2b2b;
      font-weight: 500;
      transition: color 0.2s;
    }

    .top-links a:hover {
      color: #138735;
    }

    /* "Bolalarga" ko'k tugmasi */
    .kids-badge {
      background-color: #58c9f3;
      color: #ffffff !important;
      padding: 4px 12px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .phone-number {
      font-weight: 700;
      color: #1a1a1a;
      text-decoration: none;
      font-size: 13px;
    }

    .lang-selector {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }

    /* Asosiy Header qatori */
    .main-nav {
      max-width: 1360px;
      margin: 0 auto;
      padding: 12px 24px 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      color: #0c9b39;
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid #e2e8e3;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #555;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      border-color: #0c9b39;
      color: #0c9b39;
    }

    .cart-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #38a14b;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 24px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    .cart-btn:hover {
      background-color: #2e863d;
    }

    .login-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #ffffff;
      color: #2b2b2b;
      padding: 10px 18px;
      border-radius: 24px;
      border: 1px solid #e2e8e3;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }

    .login-btn:hover {
      border-color: #bbb;
    }

    /* ================= HERO SECTION ================= */
    .hero-section {
      max-width: 1360px;
      margin: 24px auto 0 auto;
      padding: 0 24px;
    }

    .banners-container {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 12px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none; /* Firefox */
    }

    .banners-container::-webkit-scrollbar {
      display: none; /* Chrome, Safari */
    }

    /* Yashil hoshiyali banner kartasi */
    .banner-card {
      flex: 0 0 calc((100% - (16px * 5)) / 6); /* Katta ekranda 6 ta karta */
      min-width: 175px;
      aspect-ratio: 1 / 1.42;
      border-radius: 20px;
      border: 2px solid #0c9b39; /* Saytdagi yashil border */
      overflow: hidden;
      position: relative;
      background-color: #ffffff;
      box-shadow: 0 4px 14px rgba(12, 155, 57, 0.08);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      scroll-snap-align: start;
    }

    .banner-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(12, 155, 57, 0.18);
    }

    .banner-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Responsiv ko'rinish */
    @media (max-width: 1024px) {
      .banner-card {
        flex: 0 0 calc((100% - (16px * 3)) / 4);
      }
      .top-links a:not(.kids-badge) {
        display: none;
      }
    }

    @media (max-width: 600px) {
      .banner-card {
        flex: 0 0 calc(60% - 16px);
      }
      .top-bar {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <!-- Kichik yuqori panel -->
    <div class="top-bar">
      <div class="top-links">
        <a href="#">Filiallar</a>

        <a href="#">Biz haqimizda ▾</a>
        <a href="#" class="kids-badge">
          <span>✈️</span> Bolalarga
        </a>
      </div>
      <div class="top-right">
        <a href="tel:+998712031212" class="phone-number">+998 71 203 12 12</a>
        <div class="lang-selector">
          <span>O'zbek Tili</span>

        </div>
      </div>
    </div>

    <!-- Asosiy header qismi -->
    <div class="main-nav">
      <div class="logo-container">

      <div class="header-actions">

        <button class="icon-btn" aria-label="Qidirish">

        <!-- Savat -->

          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          Savat
        </a>

        <!-- Kirish -->
        <a href="#" class="login-btn">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Kirish
        </a>
      </div>
    </div>
  </header>

  <!-- HERO SECTION (Bannerlar karuseli) -->
  <section class="hero-section">
    <div class="banners-container">
      
      <!-- 1. Aksiyalar / Chegirma kartasi -->
      <div class="banner-card">
        <img src="https://images.unsplash.com/photo-1561758033-d89a9ad46330?w=600&auto=format&fit=crop&q=80" alt="-10% Aksiya" />
      </div>

      <!-- 2. EVOS Rewards / Tangalar -->
      <div class="banner-card">
        <img src="https://images.unsplash.com/photo-1559526324-4b87b5e36e44?w=600&auto=format&fit=crop&q=80" alt="EVOS Rewards" />
      </div>

      <!-- 3. Chizzi Chizz Lavashlar -->
      <div class="banner-card">
        <img src="https://images.unsplash.com/photo-1626700051175-6818013e1d4f?w=600&auto=format&fit=crop&q=80" alt="Chizzi Chizz" />
      </div>

      <!-- 4. One Piece Magic Box (Bolalar menyusi) -->
      <div class="banner-card">
        <img src="https://images.unsplash.com/photo-1509722747041-616f39b57569?w=600&auto=format&fit=crop&q=80" alt="Magic Box Bolalarga" />
      </div>

      <!-- 5. Lavash Combo menyu -->
      <div class="banner-card">
        <img src="https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=600&auto=format&fit=crop&q=80" alt="Lavash Combo" />
      </div>

      <!-- 6. Strips & Kartoshka Fri Box -->
      <div class="banner-card">
        <img src="https://images.unsplash.com/photo-1576107232684-1279f3908594?w=600&auto=format&fit=crop&q=80" alt="Kids Box Set" />
      </div>

    </div>
  </section>

</body>
</html>
